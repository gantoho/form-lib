    <style>
        .right_top_tab {
            display: flex;
            background-color: #EEEEEE;
            padding: 4px;
            width: 100%;
            max-width: 600px;
            border-radius: 1000px;
            gap: 4px;
            position: relative;
            margin-bottom: 24px;
            align-items: center;
            list-style: none;
        }

        .right_top_tab li {
            font-size: 16px;
            text-align: left;
            width: 100%;
            position: relative;
            z-index: 1;
            margin-bottom: 0 !important;
        }

        .right_top_tab li a {
            color: #232020;
            display: inline-block;
            width: 100%;
            padding: 12px;
            border-radius: 100px;
            text-align: center;
            text-decoration: none;
        }

        .right_top_tab li.active a {
            color: #EEEEEE;
            transition: all ease-in-out 0.3s;
        }

        .right_top_tab i {
            display: inline-block;
            width: calc(50% - 6px);
            height: calc(100% - 8px);
            background-color: #006BFF;
            position: absolute;
            top: 4px;
            border-radius: 100px;
            z-index: 0;
            transition: all .3s ease-in-out;
        }

        .right_top_tab li:nth-child(1).active~i {
            left: 4px;
        }

        .right_top_tab li:nth-child(2).active~i {
            left: calc(50% + 2px);
        }

        /* Tab 切换容器样式 */
        .tab-container {
            max-width: 600px;
        }
    </style>
</head>

        document.getElementById('print').addEventListener('click', () => {
            if (form.validate()) {
                console.log('验证通过，表单值:', form.getValues());
                alert('提交成功！');
            } else {
                console.log('验证失败，表单值:', form.getValues());
                console.log('验证失败，错误信息:', form.getErrors());
            }
        });
        const container = document.getElementById('tab-container');
        const lis = document.querySelectorAll('.right_top_tab li');
        lis.forEach((li, index) => {
            li.onclick = function () {
                lis.forEach(item => item.classList.remove('active'));
                this.classList.add('active');

                if (index === 0) {
                    container.dataset.activeTab = 'email';
                } else if (index === 1) {
                    container.dataset.activeTab = 'phone';
                }

                // 重新评估 when 条件
                form._evaluateWhenConditions();
            }
        })
    </script>
</body>

</html>
